<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battleground — Who Would Win?</title>
  <meta name="description" content="Type two fighters. Anything. Find out who wins." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="arena">
    <div class="arena__side arena__side--a" aria-hidden="true"></div>
    <div class="arena__side arena__side--b" aria-hidden="true"></div>

    <header class="hud">
      <span class="hud__logo">Battleground</span>
      <a class="hud__link" href="battledex.html">My BattleDex</a>
    </header>

    <main class="ring">
      <section class="fighter-slot fighter-slot--a">
        <span class="fighter-slot__eyebrow">Fighter A</span>
        <input
          id="fighterA"
          class="fighter-slot__input"
          type="text"
          maxlength="80"
          autocomplete="off"
          placeholder="Type a fighter… (try '10 lions')"
        />
      </section>

      <div class="seam">
        <button id="fightButton" class="fight-button" type="button">
          <span class="fight-button__vs">VS</span>
          <span class="fight-button__label">Fight!</span>
        </button>
      </div>

      <section class="fighter-slot fighter-slot--b">
        <span class="fighter-slot__eyebrow">Fighter B</span>
        <input
          id="fighterB"
          class="fighter-slot__input"
          type="text"
          maxlength="80"
          autocomplete="off"
          placeholder="Type a fighter… (try 'a very angry toaster')"
        />
      </section>
    </main>

    <p id="formError" class="form-error" role="alert" hidden></p>

    <section id="loadingView" class="loading-view" hidden>
      <div class="loading-view__spinner" aria-hidden="true">
        <span class="loading-view__spinner-vs">VS</span>
      </div>
      <p id="loadingMessage" class="loading-view__message">Sharpening claws…</p>
      <div class="loading-view__bar">
        <div class="loading-view__bar-fill"></div>
      </div>
    </section>

    <section id="resultView" class="result-view" hidden>
      <div class="result-view__portraits">
        <div id="portraitA" class="portrait-card portrait-card--a">
          <span class="portrait-card__winner-badge">Winner!</span>
          <img id="portraitImageA" class="portrait-card__image" alt="" />
          <span id="portraitLabelA" class="portrait-card__label"></span>
          <button class="portrait-card__save" type="button" data-save="A">Save to BattleDex</button>
        </div>

        <span class="result-view__vs" aria-hidden="true">VS</span>

        <div id="portraitB" class="portrait-card portrait-card--b">
          <span class="portrait-card__winner-badge">Winner!</span>
          <img id="portraitImageB" class="portrait-card__image" alt="" />
          <span id="portraitLabelB" class="portrait-card__label"></span>
          <button class="portrait-card__save" type="button" data-save="B">Save to BattleDex</button>
        </div>
      </div>

      <div class="verdict-card">
        <p id="verdictText" class="verdict-card__text"></p>
      </div>

      <button id="fightAgainButton" class="fight-again-button" type="button">Fight Again</button>
    </section>

    <section id="errorView" class="error-view" hidden>
      <p id="errorMessage" class="error-view__message"></p>
      <button id="retryButton" class="error-view__retry" type="button">Try Again</button>
    </section>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/battle.js"></script>
</body>
</html>
